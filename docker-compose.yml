services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-hiippoo}
      MARIADB_USER: ${DB_USER:-hiippoo}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-hiippoo}
      DB_USER: ${DB_USER:-hiippoo}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-noreply@example.com}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
